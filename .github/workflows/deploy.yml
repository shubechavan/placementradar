name: CI / CD — PlacementRadar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/placementradar

jobs:
  # ── 1. Lint & basic checks ───────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linter
        run: pip install flake8

      - name: Flake8 (errors only)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Only fails on syntax errors and undefined names — not style issues

  # ── 2. Build Docker image & push to GitHub Container Registry ───────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: lint
    # Only push on merges to main, not on PRs (PRs just verify the build)
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (and push on main)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha          # GitHub Actions cache — speeds up rebuilds
          cache-to:   type=gha,mode=max

  # ── 3. Deploy to Render ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            --retry 3
        # RENDER_DEPLOY_HOOK: copy from Render dashboard → Service → Settings → Deploy Hook

      - name: Wait for deploy to complete
        run: |
          echo "Waiting 90s for Render to pull image and restart..."
          sleep 90

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_APP_URL }}/api/dashboard")
          echo "Health check HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check FAILED"
            exit 1
          fi
          echo "Deploy successful — app is live!"
        # RENDER_APP_URL: your Render app URL, e.g. https://placementradar.onrender.com
